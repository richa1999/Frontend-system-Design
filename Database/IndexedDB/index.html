<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App with IndexedDB</title>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>
    <h1>Todo App</h1>

    <form id="todoForm">
        <input type="text" id="todoInput" placeholder="Enter a todo" required>
        <button type="submit">Add Todo</button>
    </form>

    <ul id="todoList"></ul>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const db = new Dexie('todoDB');
            db.version(1).stores({todos: '++id, task'});

            const todoForm = document.getElementById('todoForm');
            const todoInput = document.getElementById('todoInput');
            const todoList = document.getElementById('todoList');

            function addTodo() {
                db.todos.add({task: todoInput.value}).then(displayTodos);
                todoInput.value = '';
            }

            function displayTodos() {
                db.todos.toArray().then(todos => {
                    while(todoList.firstChild){
                        todoList.removeChild(todoList.firstChild);
                    }

                    todos.forEach(todo => {
                        const listItem = document.createElement('li');
                        listItem.textContent = todo.task;
                        todoList.appendChild(listItem);
                    });
                })
            }

            todoForm.addEventListener('submit', function(e) {
                e.preventDefault();
                addTodo();
            });
        })
    </script>
</body>
</html>
